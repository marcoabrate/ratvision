name: Deploy Docs

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Preview build on dev — just checks that the docs build without errors
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdoc .
      - name: Build docs (preview only)
        run: pdoc ratvision '!ratvision.blender_script' -o docs

  # Deploy to GitHub Pages on main
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pdoc .
      - name: Build docs
        run: pdoc ratvision '!ratvision.blender_script' -o docs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
